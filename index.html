<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Elixir Cyber Security Learning Community">
  <title>Elixir | Learning Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="loader" id="loader" aria-live="polite">Elixir</div>

  <main id="auth-screen" class="auth-screen">
    <section class="auth-card">
      <div class="logo auth-logo">Elixir</div>
      <p class="muted">Cyber Security Learning Community</p>
      <div id="config-warning" class="state-message warning hidden"></div>
      <form id="auth-form" novalidate>
        <div id="register-fields" class="hidden">
          <label>Display name<input name="display_name" autocomplete="name" minlength="2" maxlength="80"></label>
          <label>Username<input name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,30}" maxlength="30"></label>
        </div>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="post-btn auth-submit" type="submit">Log in</button>
      </form>
      <div class="auth-actions">
        <button id="auth-toggle" class="text-button" type="button">Create an account</button>
        <button id="reset-password" class="text-button" type="button">Forgot password?</button>
      </div>
    </section>
  </main>

  <div id="app-shell" class="all-body hidden">
    <aside class="left">
      <button class="logo nav-button" data-route="feed" aria-label="Elixir home">Elixir</button>
      <button class="logoexh nav-button" data-route="feed" aria-label="Elixir home">E</button>
      <nav class="menu" aria-label="Main navigation">
        <button class="menu-item nav-button active" data-route="feed" data-tooltip="Home"><span class="menu-item-logo"><i class="fa-solid fa-house"></i></span><span class="menu-item-word">Home</span></button>
        <button class="menu-item nav-button" data-route="groups" data-tooltip="Groups"><span class="menu-item-logo"><i class="fa-solid fa-users"></i></span><span class="menu-item-word">Groups</span></button>
        <button class="menu-item nav-button" data-route="assignments" data-tooltip="Assignments"><span class="menu-item-logo"><i class="fa-solid fa-list-check"></i></span><span class="menu-item-word">Assignments</span></button>
        <button class="menu-item nav-button" data-route="notifications" data-tooltip="Notifications"><span class="menu-item-logo notification-icon"><i class="fa-solid fa-bell"></i><span id="notification-dot" class="notification-dot hidden"></span></span><span class="menu-item-word">Notifications</span></button>
        <button class="menu-item nav-button" data-route="profile" data-tooltip="Profile"><span class="menu-item-logo"><i class="fa-solid fa-user"></i></span><span class="menu-item-word">Profile</span></button>
        <button id="admin-nav" class="menu-item nav-button hidden" data-route="admin" data-tooltip="Admin"><span class="menu-item-logo"><i class="fa-solid fa-shield-halved"></i></span><span class="menu-item-word">Admin</span></button>
      </nav>
      <button id="account-menu" class="profile-sec" type="button" aria-label="Account menu">
        <span class="left-sec"><span class="profile-img"><img id="sidebar-avatar" alt="Your avatar"></span><span class="inform"><span id="sidebar-name" class="ad"></span><span id="sidebar-username" class="username"></span></span></span>
        <span class="right-sec"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
      </button>
    </aside>

    <section class="mid" id="main-column">
      <header class="selection page-header">
        <button id="page-title" class="discovery x" type="button">Home</button>
        <button id="page-action" class="following" type="button">Qrup</button>
        <button id="page-refresh" class="page-refresh" type="button" aria-label="Refresh feed" title="Refresh feed"><i class="fa-solid fa-rotate-right"></i></button>
      </header>
      <div id="view" aria-live="polite"></div>
    </section>

    <aside class="right">
      <label class="as-s"><i class="fa-solid fa-magnifying-glass"></i><input id="global-search" type="search" placeholder="Search community" aria-label="Search community"></label>
      <div class="banner cyber-banner"><i class="fa-solid fa-user-shield"></i><span>Learn. Practice.<br>Defend.</span></div>
      <section class="wh">
        <div class="whh">Bootcamp topics</div>
        <div class="trends"><button class="trend">#CyberSecurity</button><button class="trend">#Linux</button><button class="trend">#EthicalHacking</button><button class="trend">#BlueTeam</button></div>
      </section>
      <section class="weather-box community-status"><div class="wbh"><i class="fa-solid fa-users"></i> Community</div><p id="community-count">Loading members…</p><h3 id="community-status">Secure &amp; online</h3></section>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
